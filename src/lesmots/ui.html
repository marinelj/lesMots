<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LesMots</title>
<style>
  :root { --accent:#4f46e5; --bg:#f8fafc; --card:#fff; --ink:#0f172a; --muted:#64748b; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; margin:0; background:var(--bg); color:var(--ink); }
  header { background:var(--accent); color:#fff; padding:14px 24px; display:flex; align-items:baseline; gap:12px; }
  header h1 { margin:0; font-size:22px; }
  header span { opacity:.8; font-size:13px; }
  main { max-width:900px; margin:24px auto; padding:0 16px; display:grid; gap:16px; }
  .card { background:var(--card); border:1px solid #e2e8f0; border-radius:10px; padding:16px 20px; }
  .card h2 { margin:0 0 10px; font-size:15px; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; }
  .row { display:flex; gap:10px; flex-wrap:wrap; }
  button { background:var(--accent); color:#fff; border:none; border-radius:8px; padding:10px 18px;
           font-size:15px; cursor:pointer; }
  button.secondary { background:#e2e8f0; color:var(--ink); }
  button:disabled { opacity:.5; cursor:wait; }
  input[type=text] { flex:1; min-width:200px; padding:10px; border:1px solid #cbd5e1; border-radius:8px; font-size:15px; }
  #demo { font-size:17px; line-height:1.7; min-height:60px; }
  #demo b { color:var(--accent); }
  #original { font-size:14px; color:var(--muted); line-height:1.6; }
  #original a { color:var(--accent); }
  #explanation { white-space:pre-wrap; line-height:1.6; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th,td { text-align:left; padding:8px 10px; border-bottom:1px solid #e2e8f0; }
  th { color:var(--muted); font-weight:600; }
  .lvl { display:inline-block; min-width:26px; text-align:center; border-radius:6px;
         background:#eef2ff; color:var(--accent); font-weight:600; padding:2px 6px; }
  .muted { color:var(--muted); }
  #status { font-size:13px; color:var(--muted); }
</style>
</head>
<body>
<header><h1>LesMots</h1><span>learn words inside the news you care about</span></header>
<main>

  <div class="card">
    <h2>Add a word / phrase / sentence</h2>
    <div class="row">
      <input id="new-word" type="text" placeholder="e.g. inference, state of the art, ...">
      <button id="btn-add">Add &amp; Explain</button>
    </div>
    <p id="explanation" class="muted"></p>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;align-items:center">
      <h2 style="margin:0">Demonstration area</h2>
      <div class="row">
        <button id="btn-show">New Journey</button>
        <button id="btn-more" disabled>Keep reading</button>
        <button id="btn-love" disabled>I Love This</button>
        <button id="btn-bank" class="secondary">Word bank</button>
      </div>
    </div>
    <p id="demo" class="muted">Click “New Journey” to get today’s rewritten content.</p>
    <p id="status"></p>
  </div>

  <div class="card" id="original-card" style="display:none">
    <h2>Original content (no rewrite)</h2>
    <div id="original"></div>
  </div>

  <div class="card" id="bank-card" style="display:none">
    <h2>Word bank</h2>
    <table>
      <thead><tr><th>Word / Phrase / Sentence</th><th>Kind</th><th>Added</th>
                 <th>Exposure count</th><th>Familiarity</th></tr></thead>
      <tbody id="bank-body"></tbody>
    </table>
  </div>

</main>
<script>
const $ = id => document.getElementById(id);
const api = (path, opts) => fetch(path, opts).then(r => r.json());

if (location.protocol === 'file:') {
  $('demo').innerHTML = '<b>This page must be served by LesMots, not opened as a file.</b><br>' +
    'Run <code>lesmots serve</code> in a terminal, then open ' +
    '<a href="http://127.0.0.1:8321">http://127.0.0.1:8321</a>.';
}

function renderDemo(p) {
  if (p.error) { $('status').textContent = p.error; return; }
  $('demo').classList.remove('muted');
  $('demo').innerHTML = p.rewritten.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
                                   .replace(/\n/g, '<br>');
  $('btn-more').disabled = false;
  $('btn-love').disabled = false;
  const o = p.original;
  $('original-card').style.display = '';
  $('original').innerHTML =
    `<p><strong>${o.title}</strong> — ${o.source} (${o.points} points)</p>` +
    `<p>${o.text || ''}</p><p><a href="${o.url}" target="_blank">${o.url}</a></p>`;
  $('status').textContent = p.words_used.length
    ? `Words exposed this time: ${p.words_used.join(', ')} — exposure counts updated.`
    : 'No bank words were used — add more words!';
}

$('btn-show').onclick = async () => {
  $('btn-show').disabled = true;
  $('status').textContent = 'Preparing content…';
  try { renderDemo(await api('/api/show-me', {method:'POST'})); loadBank(); }
  catch (e) { $('status').textContent = 'Error: ' + e; }
  $('btn-show').disabled = false;
};

$('btn-more').onclick = async () => {
  $('btn-more').disabled = true;
  $('status').textContent = 'Extending the story…';
  try { renderDemo(await api('/api/keep-reading', {method:'POST'})); loadBank(); }
  catch (e) { $('status').textContent = 'Error: ' + e; }
  $('btn-more').disabled = false;
};

$('btn-love').onclick = async () => {
  $('btn-love').disabled = true;
  try {
    const res = await api('/api/love', {method:'POST'});
    $('status').textContent = res.error || 'Saved — this story is now in your loved list. ❤';
  } catch (e) { $('status').textContent = 'Error: ' + e; }
  $('btn-love').disabled = false;
};

async function loadBank() {
  const words = await api('/api/words');
  $('bank-body').innerHTML = words.map(w =>
    `<tr><td>${w.text}</td><td class="muted">${w.kind}</td>
     <td class="muted">${w.added.slice(0,10)}</td><td>${w.exposure_count}</td>
     <td><span class="lvl">${w.familiarity}</span></td></tr>`).join('')
    || '<tr><td colspan="5" class="muted">Empty — add your first word above.</td></tr>';
}

$('btn-bank').onclick = () => {
  const card = $('bank-card');
  card.style.display = card.style.display === 'none' ? '' : 'none';
  if (card.style.display !== 'none') loadBank();
};

$('btn-add').onclick = async () => {
  const text = $('new-word').value.trim();
  if (!text) return;
  $('btn-add').disabled = true;
  $('explanation').textContent = 'Explaining…';
  try {
    const res = await api('/api/add', {method:'POST', headers:{'content-type':'application/json'},
                                       body: JSON.stringify({text})});
    $('explanation').textContent = res.explanation || res.error || 'Added.';
    $('new-word').value = '';
    loadBank();
  } catch (e) {
    $('explanation').textContent = 'Error: ' + e + ' — is the server running? Start it with: lesmots serve';
  }
  $('btn-add').disabled = false;
};
</script>
</body>
</html>

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lesmots"
version = "0.2.0"
description = "LesMots — learn vocabulary inside daily internet content, scheduled by spaced repetition."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
authors = [{ name = "marine" }]
keywords = ["language-learning", "flashcards", "spaced-repetition", "french", "vocabulary"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
lesmots = "lesmots.cli:main"

[project.urls]
Homepage = "https://github.com/marine/lesmots"

[tool.hatch.build.targets.wheel]
packages = ["src/lesmots"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

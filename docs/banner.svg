<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.5" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="14" flood-color="#4f46e5" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- decorative floating word pills -->
  <g font-family="Georgia, 'Times New Roman', serif" font-style="italic" opacity="0.35">
    <text x="1050" y="110" font-size="30" fill="#ef4444">nouveau</text>
    <text x="90" y="560" font-size="28" fill="#f59e0b">familier</text>
    <text x="1090" y="580" font-size="30" fill="#22c55e">maîtrisé</text>
  </g>

  <!-- wordmark -->
  <text x="90" y="150" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="96" fill="#0f172a">Les<tspan fill="#4f46e5">Mots</tspan></text>
  <rect x="94" y="176" width="330" height="10" rx="5" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="92" y="248" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" fill="#334155">Reading the news <tspan font-style="italic" fill="#4f46e5">is</tspan> the review.</text>
  <text x="92" y="296" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#64748b">Daily stories rewritten with the words you're learning — scheduled by spaced repetition.</text>

  <!-- story card -->
  <g filter="url(#shadow)">
    <rect x="90" y="350" width="1100" height="200" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  </g>
  <!-- card header -->
  <circle cx="130" cy="392" r="9" fill="#4f46e5"/>
  <text x="152" y="400" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" font-weight="600" fill="#64748b" letter-spacing="2">TODAY'S JOURNEY</text>

  <!-- story text with highlighted words -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#0f172a">
    <text x="130" y="455">A new model set a
      <tspan dx="8" fill="#b91c1c" font-weight="bold">state of the art</tspan>
      <tspan dx="8">result on every</tspan>
      <tspan dx="8" fill="#b45309" font-weight="bold">benchmark</tspan><tspan>,</tspan>
    </text>
    <text x="130" y="505">while cutting the cost of
      <tspan dx="8" fill="#15803d" font-weight="bold">inference</tspan>
      <tspan dx="8">in half.</tspan>
    </text>
  </g>

  <!-- highlight underlines -->
  <rect x="416" y="463" width="238" height="7" rx="3.5" fill="#ef4444" opacity="0.8"/>
  <rect x="905" y="463" width="170" height="7" rx="3.5" fill="#f59e0b" opacity="0.8"/>
  <rect x="500" y="513" width="140" height="7" rx="3.5" fill="#22c55e" opacity="0.8"/>

  <!-- legend -->
  <g font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="19" fill="#64748b">
    <circle cx="800" cy="392" r="8" fill="#ef4444"/><text x="816" y="399">new</text>
    <circle cx="890" cy="392" r="8" fill="#f59e0b"/><text x="906" y="399">learning</text>
    <circle cx="1010" cy="392" r="8" fill="#22c55e"/><text x="1026" y="399">mastered</text>
  </g>

  <!-- footer -->
  <text x="90" y="608" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="22" fill="#4f46e5">github.com/marinelj/lesMots</text>
  <text x="1190" y="608" text-anchor="end" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#94a3b8">open source · Python · Gemini</text>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check .
      - run: pytest -v

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix "$RUNNER_TEMP/dashboard-browser" playwright@1.62.1
      - run: '"$RUNNER_TEMP/dashboard-browser/node_modules/.bin/playwright" install --with-deps chromium'
      - run: node --test tests/dashboard.test.mjs
        env:
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/dashboard-browser/node_modules/playwright/index.mjs
